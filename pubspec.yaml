name: yap_chat
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  bloc_concurrency: ^0.3.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  equatable: ^2.1.0
  flutter_dotenv: ^6.0.1
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.3.0
  geolocator: ^14.0.3
  saver_gallery: ^5.1.0
  google_fonts: ^8.2.1
  image: ^4.9.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  stream_transform: ^2.1.1
  talker_bloc_logger: ^5.1.20
  talker_flutter: ^5.1.20

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  auto_route: ^11.1.0
  image_picker: ^1.2.3
  permission_handler: ^13.0.1
  path_provider: ^2.1.3
  path: ^1.9.0
  record: ^7.1.1
  just_audio: ^0.10.6
  url_launcher: ^6.3.2
  uuid: ^4.5.2
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/logo_yap_chat.png"

  adaptive_icon_background: "#03A6E1"
  adaptive_icon_foreground: "assets/logo/adaptive_icon_foreground.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/logo/

  fonts:
    - family: RobotoFlex
      fonts:
        - asset: assets/fonts/RobotoFlex-VF.ttf

